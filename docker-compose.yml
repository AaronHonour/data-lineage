version: '3.8'

services:
  # PostgreSQL database for lineage metadata
  lineage-db:
    image: postgres:15-alpine
    container_name: lineage-postgres
    environment:
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage_password
      POSTGRES_DB: lineage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sample PostgreSQL database for testing connectors
  sample-db:
    image: postgres:15-alpine
    container_name: sample-postgres
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample_password
      POSTGRES_DB: sample
    ports:
      - "5433:5432"
    volumes:
      - ./sample-data/init.sql:/docker-entrypoint-initdb.d/init.sql
      - sample_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sample MySQL database for testing connectors
  sample-mysql:
    image: mysql:8.0
    container_name: sample-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sample
      MYSQL_USER: sample
      MYSQL_PASSWORD: sample_password
    ports:
      - "3306:3306"
    volumes:
      - ./sample-data/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sample", "-psample_password"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # Sample SQL Server database for testing connectors
  sample-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sample-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SamplePassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./sample-data/sqlserver-init.sql:/docker-entrypoint-initdb.d/init.sql
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P SamplePassword123! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lineage-backend
    depends_on:
      lineage-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://lineage:lineage_password@lineage-db:5432/lineage
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (optional, for full stack testing)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: lineage-frontend
  #   depends_on:
  #     - backend
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   command: npm run dev

volumes:
  postgres_data:
  sample_data:
  mysql_data:
  sqlserver_data:
