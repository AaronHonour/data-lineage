version: '3.8'

services:
  # Main lineage metadata database
  lineage-db:
    image: postgres:15-alpine
    container_name: lineage-db
    environment:
      POSTGRES_DB: lineage
      POSTGRES_USER: lineage_user
      POSTGRES_PASSWORD: lineage_pass
    ports:
      - "5432:5432"
    volumes:
      - lineage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage_user -d lineage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lineage-network

  # Source PostgreSQL database (raw operational data)
  postgres-source:
    image: postgres:15-alpine
    container_name: postgres-source
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./sample-data/postgres-source/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lineage-network

  # Source MySQL database (auxiliary data)
  mysql-source:
    image: mysql:8.0
    container_name: mysql-source
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: auxiliary
      MYSQL_USER: mysql_user
      MYSQL_PASSWORD: mysql_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-source-data:/var/lib/mysql
      - ./sample-data/mysql-source/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mysql_user", "-pmysql_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lineage-network

  # Backend API service
  lineage-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lineage-api
    environment:
      DATABASE_URL: postgresql+asyncpg://lineage_user:lineage_pass@lineage-db:5432/lineage
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      lineage-db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ./sample-data/dbt-project:/dbt-project:ro
      - ./sample-data/python-jobs:/python-jobs:ro
      - ./sample-data/delta-lake:/delta-lake
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lineage-network

  # dbt service for running transformations (optional - for future use)
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.4
    container_name: dbt
    environment:
      DBT_PROFILES_DIR: /dbt-project
    volumes:
      - ./sample-data/dbt-project:/dbt-project
    depends_on:
      postgres-source:
        condition: service_healthy
    networks:
      - lineage-network
    command: ["tail", "-f", "/dev/null"]  # Keep container running

  # Frontend UI service
  lineage-ui:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lineage-ui
    ports:
      - "3000:80"
    depends_on:
      lineage-api:
        condition: service_healthy
    networks:
      - lineage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lineage-db-data:
  postgres-source-data:
  mysql-source-data:

networks:
  lineage-network:
    driver: bridge
